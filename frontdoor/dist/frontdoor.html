<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontdoor</title>
<meta name="description" content="Run your job search like a named account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* assets/css/tokens.css */
/* ==========================================================================
   Frontdoor — design tokens
   Light-mode product. Every value is defined here; nothing hard-codes a colour.
   ========================================================================== */

:root {
  /* ---- surfaces ------------------------------------------------------- */
  --bg:            #F7F7F8;   /* app canvas */
  --panel:         #FFFFFF;   /* cards, sheets, inputs */
  --sunk:          #F1F2F4;   /* wells, hovers, secondary fills */
  --sunk-2:        #E9EAED;   /* pressed / heavier wells */
  --overlay:       rgba(17, 18, 21, .38);

  /* ---- ink ------------------------------------------------------------ */
  --ink:           #111215;
  --ink-2:         #555963;
  --ink-3:         #868B96;
  --ink-4:         #B0B4BD;
  --ink-inv:       #FFFFFF;

  /* ---- lines ---------------------------------------------------------- */
  --line:          #E6E7EA;
  --line-2:        #D6D8DD;
  --line-3:        #C2C5CC;

  /* ---- accent (selection, focus, active state, links) ----------------- */
  --ac:            #4C6FFF;
  --ac-hover:      #3A5BEA;
  --ac-wash:       #EEF2FF;
  --ac-line:       #C7D3FF;

  /* ---- primary action is near-black, not accent ----------------------- */
  --solid:         #17181C;
  --solid-hover:   #000000;

  /* ---- semantic ------------------------------------------------------- */
  --pos:           #0F8A5F;   --pos-wash: #E4F4EC;   --pos-line: #B7E2CE;
  --warn:          #A66A00;   --warn-wash: #FCF2E0;  --warn-line: #EFD8A8;
  --neg:           #C8372E;   --neg-wash: #FCEAE8;   --neg-line: #F2C6C1;

  /* ---- persona colours (assigned, never decorative) ------------------- */
  --p-peer:        #0F8A5F;
  --p-recruiter:   #7B4FD0;
  --p-manager:     #4C6FFF;
  --p-exec:        #A66A00;
  --p-tie:         #BE4463;

  /* ---- spacing: 4px base ---------------------------------------------- */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px; --s-5: 20px;
  --s-6: 24px; --s-7: 32px; --s-8: 40px; --s-9: 56px; --s-10: 72px;

  /* ---- radius: overlays sit higher than cards ------------------------- */
  --r-1: 6px;  --r-2: 8px;  --r-3: 10px; --r-4: 14px; --r-5: 18px;
  --r-full: 999px;

  /* ---- elevation: tight, downward, single direction -------------------- */
  --e-1: 0 1px 2px rgba(17, 18, 21, .05);
  --e-2: 0 1px 3px rgba(17, 18, 21, .07), 0 1px 2px rgba(17, 18, 21, .04);
  --e-3: 0 4px 12px rgba(17, 18, 21, .07), 0 1px 3px rgba(17, 18, 21, .05);
  --e-4: 0 12px 32px rgba(17, 18, 21, .12), 0 2px 8px rgba(17, 18, 21, .06);
  --e-5: 0 24px 64px rgba(17, 18, 21, .18), 0 4px 12px rgba(17, 18, 21, .08);
  --ring: 0 0 0 3px var(--ac-wash);

  /* ---- motion ---------------------------------------------------------- */
  --t-1: 110ms;   /* press feedback */
  --t-2: 170ms;   /* hover, colour */
  --t-3: 240ms;   /* enter, layout */
  --t-4: 380ms;   /* page transitions */
  --ease:   cubic-bezier(.2, .8, .3, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);

  /* ---- type ------------------------------------------------------------ */
  --ui:   'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

  --fs-xs:   11.5px;
  --fs-sm:   12.5px;
  --fs-base: 13.75px;
  --fs-md:   15px;
  --fs-lg:   17px;
  --fs-xl:   21px;
  --fs-2xl:  27px;
  --fs-3xl:  34px;

  /* ---- layout ---------------------------------------------------------- */
  --sidebar: 244px;
  --topbar:  56px;
  --measure: 66ch;
}

/* assets/css/app.css */
/* ==========================================================================
   Frontdoor — base, components, layout
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: var(--fs-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.021em; line-height: 1.22; }
h1 { font-size: var(--fs-2xl); letter-spacing: -.03em; font-weight: 640; }
h2 { font-size: var(--fs-xl); letter-spacing: -.026em; }
h3 { font-size: var(--fs-md); }
h4 { font-size: var(--fs-base); }
p  { margin: 0; }
a  { color: var(--ac); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea, select { font: inherit; color: inherit; }
::selection { background: var(--ac-wash); }
img { max-width: 100%; }

/* one focus treatment, everywhere */
:where(a, button, input, textarea, select, [tabindex]):focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
  border-radius: var(--r-1);
}

/* ---- utilities ---------------------------------------------------------- */
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cap {
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .1em; color: var(--ink-3); font-weight: 500;
}
.dim   { color: var(--ink-2); }
.dimmer{ color: var(--ink-3); }
.hide  { display: none !important; }
.row   { display: flex; align-items: center; gap: var(--s-3); }
.col   { display: flex; flex-direction: column; }
.between { justify-content: space-between; }
.wrap  { flex-wrap: wrap; }
.grow  { flex: 1; min-width: 0; }
.g1 { gap: var(--s-1); } .g2 { gap: var(--s-2); } .g3 { gap: var(--s-3); }
.g4 { gap: var(--s-4); } .g5 { gap: var(--s-5); } .g6 { gap: var(--s-6); }
.mt2 { margin-top: var(--s-2); } .mt3 { margin-top: var(--s-3); }
.mt4 { margin-top: var(--s-4); } .mt5 { margin-top: var(--s-5); }
.mt6 { margin-top: var(--s-6); } .mt7 { margin-top: var(--s-7); }
.mb3 { margin-bottom: var(--s-3); } .mb4 { margin-bottom: var(--s-4); }
.mb5 { margin-bottom: var(--s-5); } .mb6 { margin-bottom: var(--s-6); }
.measure { max-width: var(--measure); }
.grid { display: grid; gap: var(--s-3); }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  font-size: var(--fs-base); font-weight: 550; line-height: 1;
  padding: 9px 14px; border-radius: var(--r-2); border: 1px solid transparent;
  background: none; cursor: pointer; white-space: nowrap; user-select: none;
  transition: background var(--t-2) var(--ease), border-color var(--t-2) var(--ease),
              color var(--t-2) var(--ease), box-shadow var(--t-2) var(--ease),
              transform var(--t-1) var(--ease);
}
.btn:active { transform: scale(.975); }
.btn[disabled] { opacity: .45; pointer-events: none; }

.btn-primary   { background: var(--solid); color: var(--ink-inv); box-shadow: var(--e-1); }
.btn-primary:hover { background: var(--solid-hover); box-shadow: var(--e-2); }

.btn-secondary { background: var(--panel); color: var(--ink); border-color: var(--line-2); box-shadow: var(--e-1); }
.btn-secondary:hover { border-color: var(--line-3); background: var(--sunk); }

.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--sunk); color: var(--ink); }

.btn-danger { background: var(--neg-wash); color: var(--neg); border-color: var(--neg-line); }
.btn-danger:hover { background: var(--neg); color: var(--ink-inv); border-color: var(--neg); }

.btn-sm  { padding: 6px 10px; font-size: var(--fs-sm); }
.btn-lg  { padding: 12px 20px; font-size: var(--fs-md); border-radius: var(--r-3); }
.btn-block { width: 100%; }
.btn .arr { transition: transform var(--t-2) var(--ease); }
.btn:hover .arr { transform: translateX(2px); }

/* loading */
.btn.loading { pointer-events: none; color: transparent !important; position: relative; }
.btn.loading::after {
  content: ""; position: absolute; width: 14px; height: 14px; border-radius: var(--r-full);
  border: 2px solid currentColor; border-top-color: transparent;
  color: var(--ink-inv); animation: spin .6s linear infinite;
}
.btn-secondary.loading::after, .btn-ghost.loading::after { color: var(--ink-2); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==========================================================================
   Form controls
   ========================================================================== */
.field { display: grid; gap: 6px; }
.field > label { font-size: var(--fs-sm); font-weight: 550; color: var(--ink-2); }
.input {
  width: 100%; padding: 10px 12px; border-radius: var(--r-2);
  border: 1px solid var(--line-2); background: var(--panel); color: var(--ink);
  font-size: var(--fs-base); box-shadow: var(--e-1);
  transition: border-color var(--t-2) var(--ease), box-shadow var(--t-2) var(--ease);
}
.input::placeholder { color: var(--ink-4); }
.input:hover { border-color: var(--line-3); }
.input:focus { outline: none; border-color: var(--ac); box-shadow: var(--ring); }
.input.err { border-color: var(--neg); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.6; }
.hint { font-size: var(--fs-sm); color: var(--ink-3); }
.err-txt { font-size: var(--fs-sm); color: var(--neg); }

.switch {
  width: 36px; height: 21px; border-radius: var(--r-full); background: var(--line-3);
  border: none; cursor: pointer; position: relative; flex: none; padding: 0;
  transition: background var(--t-2) var(--ease);
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px;
  border-radius: var(--r-full); background: #fff; box-shadow: var(--e-1);
  transition: transform var(--t-2) var(--spring);
}
.switch[aria-checked="true"] { background: var(--ac); }
.switch[aria-checked="true"]::after { transform: translateX(15px); }

input[type=range] {
  width: 100%; -webkit-appearance: none; appearance: none; background: none;
  height: 20px; cursor: pointer; padding: 0; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: var(--r-full); background: var(--line-2); }
input[type=range]::-moz-range-track { height: 4px; border-radius: var(--r-full); background: var(--line-2); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: var(--r-full);
  background: var(--panel); border: 1.5px solid var(--ac); box-shadow: var(--e-2);
  margin-top: -6px; transition: transform var(--t-1) var(--spring);
}
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: var(--r-full);
  background: var(--panel); border: 1.5px solid var(--ac); box-shadow: var(--e-2);
}
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.22); }

/* ==========================================================================
   Surfaces
   ========================================================================== */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-3); box-shadow: var(--e-1);
}
.card.hover {
  transition: box-shadow var(--t-2) var(--ease), border-color var(--t-2) var(--ease),
              transform var(--t-2) var(--ease);
}
.card.hover:hover { box-shadow: var(--e-3); border-color: var(--line-2); transform: translateY(-1px); }
.p3 { padding: var(--s-3); } .p4 { padding: var(--s-4); }
.p5 { padding: var(--s-5); } .p6 { padding: var(--s-6); }
.divider { border: none; border-top: 1px solid var(--line); margin: 0; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
  border-radius: var(--r-full); background: var(--sunk); border: 1px solid var(--line);
  font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap;
}
.chip b { color: var(--ink); font-weight: 600; }
.chip-accent { background: var(--ac-wash); border-color: var(--ac-line); color: var(--ac); }
.chip-pos    { background: var(--pos-wash); border-color: var(--pos-line); color: var(--pos); }
.chip-warn   { background: var(--warn-wash); border-color: var(--warn-line); color: var(--warn); }

.avatar {
  border-radius: var(--r-full); display: grid; place-items: center; flex: none;
  color: #fff; font-weight: 600; background: var(--ac);
}
.avatar-sm { width: 26px; height: 26px; font-size: 10.5px; }
.avatar-md { width: 32px; height: 32px; font-size: 12px; }
.avatar-lg { width: 40px; height: 40px; font-size: 14px; }

/* ==========================================================================
   App shell
   ========================================================================== */
#root { min-height: 100%; }

.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }

.sidebar {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: var(--s-5);
  padding: var(--s-4) var(--s-3);
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
}
/* Narrow: the rail stays on the left and collapses to icons. Navigation
   never moves to the top, because a nav that jumps position is a nav you
   have to re-find every time the window changes. */
@media (max-width: 900px) {
  :root { --sidebar: 56px; }
  .shell { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
  .sidebar { padding: var(--s-3) var(--s-2); gap: var(--s-4); align-items: center; }
  .sidebar .brand { padding: 0; justify-content: center; }
  .sidebar .brand b { display: none; }
  .side-search { justify-content: center; padding: 8px 0; }
  .side-search span:nth-child(2), .side-search kbd { display: none; }
  .nav-group-label { display: none; }
  .nav-group { margin-bottom: var(--s-3); }
  .nav-item { justify-content: center; padding: 9px 0; gap: 0; }
  .nav-item .nav-label, .nav-item .nav-count { display: none; }
  .nav-item .nav-ico { font-size: 15px; }
  .user-btn { justify-content: center; padding: var(--s-2) 0; }
  .user-btn .grow, .user-btn > span:last-child { display: none; }
  .topbar { padding: 0 var(--s-4); }
  .view { padding: var(--s-5) var(--s-4) var(--s-9); }
}
/* Phone: same rail, a little tighter */
@media (max-width: 560px) {
  :root { --sidebar: 50px; }
  .topbar { height: auto; min-height: var(--topbar); padding: var(--s-2) var(--s-3); flex-wrap: wrap; }
  .crumbs { flex-basis: 100%; }
}

.brand { display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-2); flex: none; }
.brand .glyph {
  width: 24px; height: 24px; border-radius: var(--r-1); background: var(--solid);
  position: relative; flex: none;
}
.brand .glyph::after {
  content: ""; position: absolute; top: 7px; right: 6px; width: 9px; height: 9px;
  border-radius: 2px; background: var(--ac);
}
.brand b { font-size: var(--fs-md); font-weight: 650; letter-spacing: -.03em; }

.side-search {
  display: flex; align-items: center; gap: var(--s-2); width: 100%;
  padding: 7px 10px; border: 1px solid var(--line); background: var(--sunk);
  border-radius: var(--r-2); color: var(--ink-3); font-size: var(--fs-sm); cursor: pointer;
  transition: border-color var(--t-2) var(--ease), background var(--t-2) var(--ease);
}
.side-search:hover { border-color: var(--line-2); background: var(--panel); }
.side-search kbd {
  margin-left: auto; font-family: var(--mono); font-size: 10px; padding: 2px 5px;
  border-radius: 4px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-3);
}

.side-label { padding: 0 var(--s-3) var(--s-1); }
.side-nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: var(--s-3); padding: 7px var(--s-3);
  border-radius: var(--r-2); border: none; background: none; color: var(--ink-2);
  cursor: pointer; text-align: left; width: 100%; font-size: var(--fs-base);
  font-weight: 500; white-space: nowrap; text-decoration: none;
  transition: background var(--t-1) var(--ease), color var(--t-1) var(--ease);
}
.nav-item:hover { background: var(--sunk); color: var(--ink); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--sunk); color: var(--ink); font-weight: 600; }
.nav-item .nav-ico { width: 16px; display: grid; place-items: center; color: var(--ink-3); flex: none; font-size: 13px; }
.nav-item[aria-current="page"] .nav-ico { color: var(--ac); }
.nav-item .nav-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }

.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: var(--s-3); }
.user-btn {
  display: flex; align-items: center; gap: var(--s-2); width: 100%; padding: var(--s-2);
  border-radius: var(--r-2); border: none; background: none; cursor: pointer; text-align: left;
  transition: background var(--t-1) var(--ease);
}
.user-btn:hover { background: var(--sunk); }
.user-btn .grow { display: grid; min-width: 0; }
.user-btn .un { display: block; font-size: var(--fs-sm); font-weight: 600; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-btn .ue { display: block; font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* topbar */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar); flex: none; position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-6);
}
.crumbs { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-base); color: var(--ink-3); flex: 1; min-width: 0; }
.crumbs b { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--ink-4); }
.crumbs a { color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); text-decoration: none; }

.view { padding: var(--s-7) var(--s-6) var(--s-10); max-width: 1120px; width: 100%; }
.view-enter { animation: viewIn var(--t-4) var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { margin-bottom: var(--s-6); }
.page-head h1 { margin-bottom: 3px; }
.page-head p { color: var(--ink-2); max-width: var(--measure); }

/* tabs */
.tabs { min-width: 0; display: flex; gap: var(--s-1); border-bottom: 1px solid var(--line); margin-bottom: var(--s-6); overflow-x: auto; }
.tab {
  padding: 9px var(--s-3); border: none; background: none; cursor: pointer;
  font-size: var(--fs-base); font-weight: 500; color: var(--ink-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  transition: color var(--t-2) var(--ease), border-color var(--t-2) var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--solid); }

/* ==========================================================================
   Auth
   ========================================================================== */
.auth {
  min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
  background: var(--panel);
}
@media (max-width: 880px) { .auth { grid-template-columns: 1fr; } .auth-aside { display: none; } }

.auth-main { display: grid; place-items: center; padding: var(--s-7) var(--s-5); }
.auth-box { width: 100%; max-width: 360px; animation: viewIn var(--t-4) var(--ease); }
.auth-box .brand { padding: 0; margin-bottom: var(--s-6); }
.auth-box h1 { font-size: var(--fs-2xl); margin-bottom: 4px; }
.auth-box .sub { color: var(--ink-2); margin-bottom: var(--s-6); }
.auth-box form { display: grid; gap: var(--s-4); }
.auth-alt {
  display: flex; align-items: center; gap: var(--s-3); margin: var(--s-5) 0;
  color: var(--ink-4); font-size: var(--fs-sm);
}
.auth-alt::before, .auth-alt::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth-foot { margin-top: var(--s-6); font-size: var(--fs-base); color: var(--ink-2); text-align: center; }
.demo-note {
  margin-top: var(--s-5); padding: var(--s-3) var(--s-4); border-radius: var(--r-2);
  background: var(--ac-wash); border: 1px solid var(--ac-line); font-size: var(--fs-sm); color: var(--ink-2);
}
.demo-note b { color: var(--ink); }

.auth-aside {
  background: var(--bg); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; justify-content: center; gap: var(--s-6);
  padding: var(--s-9) var(--s-8);
}
.auth-aside blockquote { margin: 0; font-size: var(--fs-lg); line-height: 1.45; letter-spacing: -.018em; }
.auth-aside .by { display: flex; align-items: center; gap: var(--s-3); color: var(--ink-2); font-size: var(--fs-sm); }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-4); }
.stat-row div b { display: block; font-size: var(--fs-xl); font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat-row div span { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.35; display: block; }

/* ==========================================================================
   Pieces
   ========================================================================== */
.empty {
  display: grid; place-items: center; text-align: center; gap: var(--s-4);
  padding: var(--s-10) var(--s-5);
}
.empty .art {
  width: 56px; height: 56px; border-radius: var(--r-4); background: var(--sunk);
  border: 1px solid var(--line); display: grid; place-items: center;
  color: var(--ink-4); font-size: 20px; box-shadow: var(--e-1);
}
.empty h2 { max-width: 24ch; }
.empty p { color: var(--ink-2); max-width: 46ch; }

.list-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: var(--s-4); align-items: center;
  padding: var(--s-4); border-bottom: 1px solid var(--line); cursor: pointer;
  transition: background var(--t-1) var(--ease);
  text-align: left; width: 100%; border-left: none; border-right: none; border-top: none;
  background: none;
}
.list-row:last-child { border-bottom: none; }
.list-row:hover { background: var(--sunk); }
.list-row:active { transform: scale(.998); }
.list-row .t { font-size: var(--fs-md); font-weight: 600; letter-spacing: -.015em; }
.list-row .s { font-size: var(--fs-sm); color: var(--ink-3); }

.progress { height: 5px; border-radius: var(--r-full); background: var(--sunk-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ac); border-radius: var(--r-full);
  transition: width var(--t-4) var(--ease); }

.ring { transform: rotate(-90deg); flex: none; }
.ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
.ring .track { stroke: var(--sunk-2); }
.ring .fill  { stroke: var(--ac); transition: stroke-dashoffset 700ms var(--ease); }

.task {
  display: grid; grid-template-columns: 20px 1fr auto; gap: var(--s-3); align-items: center;
  padding: 10px var(--s-3); border: none; background: none; width: 100%; text-align: left;
  cursor: pointer; border-radius: var(--r-2); transition: background var(--t-1) var(--ease);
}
.task:hover { background: var(--sunk); }
.task > .tt { min-width: 0; }
.tick {
  width: 19px; height: 19px; border-radius: var(--r-full); border: 1.5px solid var(--line-3);
  display: grid; place-items: center; font-size: 10px; color: transparent;
  transition: background var(--t-2) var(--spring), border-color var(--t-2) var(--ease),
              transform var(--t-2) var(--spring);
}
.task[aria-pressed="true"] .tick { background: var(--pos); border-color: var(--pos); color: #fff; transform: scale(1.1); }
.task[aria-pressed="true"] .tick::after { content: "✓"; }
.task[aria-pressed="true"] .tt { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }
.tt { font-size: var(--fs-base); font-weight: 500; transition: color var(--t-2) var(--ease); }
.tt em { font-style: normal; display: block; font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; }

.opt {
  display: grid; grid-template-columns: 18px 1fr auto; gap: var(--s-3); align-items: start;
  text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-2); padding: 11px var(--s-4); cursor: pointer;
  transition: border-color var(--t-1) var(--ease), background var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.opt:hover { border-color: var(--line-2); }
.opt:active { transform: scale(.995); }
.opt[aria-pressed="true"] { border-color: var(--ac); background: var(--ac-wash); }
.opt .box {
  width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--line-3);
  display: grid; place-items: center; font-size: 9.5px; color: transparent; margin-top: 2px;
  transition: background var(--t-2) var(--spring), border-color var(--t-2) var(--ease), transform var(--t-2) var(--spring);
}
.opt[aria-pressed="true"] .box { background: var(--ac); border-color: var(--ac); color: #fff; transform: scale(1.08); }
.opt[aria-pressed="true"] .box::after { content: "✓"; }
.opt > span:nth-child(2) { min-width: 0; }
.opt .ot { font-size: var(--fs-base); font-weight: 500; line-height: 1.45; }
.opt .ot em { font-style: normal; display: block; font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; margin-top: 1px; }
.opt .om { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ac); font-weight: 500; }
.opt.locked { opacity: .42; pointer-events: none; }

.dropzone {
  border: 1.5px dashed var(--line-3); border-radius: var(--r-3); padding: var(--s-7) var(--s-5);
  background: var(--panel); cursor: pointer; display: grid; place-items: center; gap: 6px; width: 100%;
  transition: border-color var(--t-2) var(--ease), background var(--t-2) var(--ease), transform var(--t-1) var(--ease);
}
.dropzone:hover { border-color: var(--ac); background: var(--ac-wash); }
.dropzone:active { transform: scale(.995); }
.dropzone .dz-ic {
  width: 34px; height: 34px; border-radius: var(--r-2); background: var(--sunk);
  display: grid; place-items: center; color: var(--ink-3); font-size: 14px;
  transition: background var(--t-2) var(--ease), color var(--t-2) var(--ease);
}
.dropzone:hover .dz-ic { background: var(--ac); color: #fff; }
.dropzone b { font-size: var(--fs-md); font-weight: 600; }

.skel {
  height: 10px; border-radius: var(--r-1); width: 48px; display: block;
  background: linear-gradient(90deg, var(--sunk) 25%, var(--sunk-2) 50%, var(--sunk) 75%);
  background-size: 200% 100%; animation: shimmer 1.3s linear infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.scan-line {
  display: grid; grid-template-columns: 18px 1fr auto; gap: var(--s-3); align-items: center;
  padding: 7px 0; font-size: var(--fs-base); color: var(--ink-3);
  transition: color var(--t-2) var(--ease);
}
.scan-line.done { color: var(--ink); }
.scan-line .dot {
  width: 18px; height: 18px; border-radius: var(--r-full); border: 1.5px solid var(--line-3);
  display: grid; place-items: center; font-size: 9px; color: transparent;
  transition: background var(--t-2) var(--spring), border-color var(--t-2) var(--ease), transform var(--t-2) var(--spring);
}
.scan-line.done .dot { background: var(--pos); border-color: var(--pos); color: #fff; transform: scale(1.12); }
.scan-line.done .dot::after { content: "✓"; }
.scan-line em { font-style: normal; font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3); }

/* people */
.orgmap { display: grid; grid-template-columns: 180px 1fr; gap: var(--s-6); align-items: center; }
@media (max-width: 760px) { .orgmap { grid-template-columns: minmax(0, 1fr); gap: var(--s-3); } }
.anchor { background: var(--solid); color: var(--ink-inv); border-radius: var(--r-3); padding: var(--s-4); display: grid; gap: 2px; }
.anchor .cap { color: var(--ink-4); }
.people { display: grid; gap: var(--s-2); position: relative; }
@media (min-width: 761px) { .people::before { content: ""; position: absolute; left: -12px; top: 10%; bottom: 10%; width: 1px; background: var(--line-2); } }
.person {
  display: grid; grid-template-columns: 32px 1fr auto; gap: var(--s-3); align-items: center;
  text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-2); padding: 9px var(--s-4); cursor: pointer; position: relative;
  transition: border-color var(--t-1) var(--ease), transform var(--t-1) var(--ease), box-shadow var(--t-1) var(--ease);
}
@media (min-width: 761px) { .person::before { content: ""; position: absolute; left: -12px; top: 50%; width: 12px; height: 1px; background: var(--line-2); } }
.person:hover { transform: translateX(2px); box-shadow: var(--e-2); }
.person[aria-pressed="true"] { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc); }
.person > span:nth-child(2) { min-width: 0; }
.person .pn { font-size: var(--fs-base); font-weight: 600; line-height: 1.3; }
.person .pr { font-size: var(--fs-sm); color: var(--ink-3); }
.person .pt {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--pc); background: var(--sunk); padding: 3px 8px; border-radius: var(--r-1);
}

/* sequence */
.seq { display: grid; gap: var(--s-2); padding-left: 28px; position: relative; }
.seq::before { content: ""; position: absolute; left: 9px; top: 16px; bottom: 16px; width: 1px; background: var(--line); }
.touch {
  display: grid; grid-template-columns: 46px 1fr auto auto; gap: var(--s-3); align-items: center;
  text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-2); padding: 9px var(--s-4); cursor: pointer; position: relative;
  transition: border-color var(--t-1) var(--ease), transform var(--t-1) var(--ease), box-shadow var(--t-1) var(--ease);
}
@media (max-width: 560px) { .touch { grid-template-columns: 40px 1fr auto; } .touch .tc { display: none; } }
.touch::before {
  content: ""; position: absolute; left: -24px; top: 50%; translate: 0 -50%;
  width: 9px; height: 9px; border-radius: var(--r-full); background: var(--pc);
  box-shadow: 0 0 0 3px var(--bg);
}
.touch:hover { transform: translateX(2px); box-shadow: var(--e-2); }
.touch.sent { background: var(--sunk); }
.touch .td { font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3); }
.touch > span:nth-child(2) { min-width: 0; }
.touch .tw { font-size: var(--fs-base); font-weight: 600; }
.touch .tw em { font-style: normal; display: block; font-size: var(--fs-sm); color: var(--ink-3); font-weight: 400; }
.touch .tc { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }

/* composer */
.composer { display: grid; grid-template-columns: 1fr 268px; gap: var(--s-4); align-items: start; }
@media (max-width: 920px) { .composer { grid-template-columns: minmax(0, 1fr); } }
.letter {
  font-family: var(--mono); font-size: 13px; line-height: 1.85; white-space: pre-wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3);
  padding: var(--s-6); box-shadow: var(--e-1);
}
.letter mark { background: var(--ac-wash); color: inherit; border-radius: 3px; padding: 1px 3px; box-decoration-break: clone; }
.letter.flash { animation: flash 620ms var(--ease); }
@keyframes flash { from { background: var(--ac-wash); } to { background: var(--panel); } }
.reasons { display: grid; gap: var(--s-2); margin-top: var(--s-3); }
.reason { display: grid; grid-template-columns: 18px 1fr; gap: var(--s-3); font-size: var(--fs-sm); color: var(--ink-2); align-items: start; }
.reason i {
  width: 18px; height: 18px; border-radius: var(--r-full); background: var(--ac-wash); color: var(--ac);
  display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; font-family: var(--mono);
}

.assist { margin-top: var(--s-3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3); box-shadow: var(--e-1); overflow: hidden; }
.assist-log { display: grid; gap: var(--s-2); padding: var(--s-4) var(--s-4) 0; max-height: 150px; overflow: auto; }
.assist-log:empty { display: none; }
.bubble { font-size: var(--fs-base); line-height: 1.5; padding: 7px 11px; border-radius: var(--r-3); max-width: 86%; animation: viewIn var(--t-2) var(--ease); }
.bubble.me { background: var(--solid); color: var(--ink-inv); justify-self: end; border-bottom-right-radius: 4px; }
.bubble.ai { background: var(--sunk); color: var(--ink-2); justify-self: start; border-bottom-left-radius: 4px; }
.assist-sug { display: flex; gap: var(--s-2); flex-wrap: wrap; padding: var(--s-4) var(--s-4) 0; }
.sug {
  padding: 5px 11px; border-radius: var(--r-full); border: 1px solid var(--line-2);
  background: var(--panel); font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer;
  transition: border-color var(--t-1) var(--ease), color var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.sug:hover { border-color: var(--ac); color: var(--ac); }
.sug:active { transform: scale(.96); }
.assist-in { display: flex; gap: var(--s-2); align-items: center; padding: var(--s-3) var(--s-4); border-top: 1px solid var(--line); margin-top: var(--s-4); }
.assist-in input { flex: 1; border: none; background: none; outline: none; min-width: 0; font-size: var(--fs-base); }
.assist-in input::placeholder { color: var(--ink-4); }
.assist-in button {
  width: 29px; height: 29px; border-radius: var(--r-2); border: none; background: var(--solid);
  color: var(--ink-inv); cursor: pointer; flex: none;
  transition: background var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.assist-in button:hover { background: var(--solid-hover); }
.assist-in button:active { transform: scale(.92); }

/* public page preview */
.preview { display: grid; grid-template-columns: 190px 1fr; gap: var(--s-4); align-items: start; }
@media (max-width: 920px) { .preview { grid-template-columns: minmax(0, 1fr); } }
.sec-toggles { display: grid; gap: 1px; position: sticky; top: calc(var(--topbar) + var(--s-4)); }
@media (max-width: 920px) { .sec-toggles { position: static; grid-auto-flow: column; grid-auto-columns: max-content;
  overflow-x: auto; padding-bottom: var(--s-2); min-width: 0; } .preview > div { min-width: 0; } }
.sec-tog {
  display: flex; align-items: center; gap: var(--s-2); padding: 6px var(--s-3); border-radius: var(--r-2);
  border: none; background: none; cursor: pointer; font-size: var(--fs-base); font-weight: 500;
  color: var(--ink-2); width: 100%; text-align: left; white-space: nowrap;
  transition: background var(--t-1) var(--ease);
}
.sec-tog:hover { background: var(--sunk); color: var(--ink); }
.sec-tog .box {
  width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--line-3); flex: none;
  display: grid; place-items: center; font-size: 9px; color: transparent;
  transition: background var(--t-2) var(--spring), border-color var(--t-2) var(--ease);
}
.sec-tog[aria-pressed="true"] .box { background: var(--pos); border-color: var(--pos); color: #fff; }
.sec-tog[aria-pressed="true"] .box::after { content: "✓"; }

.browser { min-width: 0; border: 1px solid var(--line); border-radius: var(--r-3); overflow: hidden; box-shadow: var(--e-3); background: var(--panel); }
.browser-bar { display: flex; align-items: center; gap: 6px; padding: 8px var(--s-4); background: var(--sunk); border-bottom: 1px solid var(--line); }
.browser-bar i { width: 8px; height: 8px; border-radius: var(--r-full); background: var(--line-3); }
.browser-bar .url { flex: 1; text-align: center; font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-3); background: var(--panel); border-radius: var(--r-1); padding: 4px 10px; }
.pub { padding: var(--s-7); display: grid; gap: var(--s-7); min-width: 0; }
.pub section { min-width: 0; }
@media (max-width: 640px) { .pub { padding: var(--s-5); } }
.pub section { display: grid; gap: var(--s-3); }
.pub .hero h2 { font-size: clamp(22px, 3.4vw, 31px); font-weight: 650; letter-spacing: -.03em; }
.pub .hero .thesis { font-size: var(--fs-md); color: var(--ink-2); max-width: 52ch; }
.stats { display: grid; gap: var(--s-2); grid-template-columns: repeat(auto-fit, minmax(138px, 1fr)); }
.stats div { background: var(--sunk); border-radius: var(--r-2); padding: var(--s-4); }
.stats b { display: block; font-size: var(--fs-xl); font-weight: 650; letter-spacing: -.03em; color: var(--ac); font-variant-numeric: tabular-nums; }
.stats span { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.4; }
.take { border-left: 2px solid var(--ac); padding-left: var(--s-4); font-size: var(--fs-md); line-height: 1.55; }
.history { display: grid; padding-left: var(--s-5); position: relative; }
.history::before { content: ""; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 1px; background: var(--line); }
.job { padding: var(--s-3) 0; position: relative; display: grid; gap: 4px; }
.job::before { content: ""; position: absolute; left: -21px; top: 17px; width: 9px; height: 9px; border-radius: var(--r-full); background: var(--panel); border: 2px solid var(--ac); }
.job .jt { display: flex; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; align-items: baseline; }
.job .jt b { font-size: var(--fs-md); font-weight: 600; }
.job .jt em { font-style: normal; font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-3); }
.job .jw { font-size: var(--fs-base); color: var(--ink-2); }
.job ul { margin: 3px 0 0; padding-left: 16px; display: grid; gap: 4px; font-size: var(--fs-base); color: var(--ink-2); }
.days { display: grid; gap: var(--s-2); }
.days div { display: grid; grid-template-columns: 42px 1fr; gap: var(--s-3); font-size: var(--fs-base); color: var(--ink-2); align-items: start; }
.days span { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ac); background: var(--ac-wash); padding: 4px 6px; border-radius: var(--r-1); text-align: center; }
.reel { aspect-ratio: 16/9; border-radius: var(--r-2); background: var(--solid); display: grid; place-items: center; cursor: pointer; }
.reel b { width: 46px; height: 46px; border-radius: var(--r-full); background: var(--ac); color: #fff; display: grid; place-items: center; transition: transform var(--t-2) var(--spring); }
.reel:hover b { transform: scale(1.12); }
.said { background: var(--sunk); border-radius: var(--r-2); padding: var(--s-5); display: grid; gap: var(--s-3); }
.said p { font-size: var(--fs-md); line-height: 1.5; }
.said .by { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--ink-2); }
.pub-foot { border-top: 1px solid var(--line); padding-top: var(--s-5); display: flex; gap: var(--s-3); flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* wizard */
.steps-bar { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-6); flex-wrap: wrap; }
.step-pip {
  display: flex; align-items: center; gap: var(--s-2); padding: 5px 11px; border-radius: var(--r-full);
  font-size: var(--fs-sm); color: var(--ink-3); background: var(--sunk); border: 1px solid transparent;
  transition: all var(--t-2) var(--ease);
}
.step-pip .n { width: 17px; height: 17px; border-radius: var(--r-full); background: var(--line-2); color: var(--panel);
  display: grid; place-items: center; font-size: 9.5px; font-weight: 700; font-family: var(--mono); }
.step-pip[data-state="active"] { background: var(--panel); border-color: var(--line-2); color: var(--ink); font-weight: 600; box-shadow: var(--e-1); }
.step-pip[data-state="active"] .n { background: var(--solid); }
.step-pip[data-state="done"] { color: var(--pos); background: var(--pos-wash); }
.step-pip[data-state="done"] .n { background: var(--pos); }
.step-pip[data-state="done"] .n::after { content: "✓"; }
.step-pip[data-state="done"] .n span { display: none; }

/* ==========================================================================
   Overlays
   ========================================================================== */
.scrim {
  position: fixed; inset: 0; z-index: 90; background: var(--overlay);
  backdrop-filter: blur(3px); display: grid; opacity: 0; pointer-events: none;
  transition: opacity var(--t-2) var(--ease);
}
.scrim.open { opacity: 1; pointer-events: auto; }

.palette-scrim { place-items: start center; padding: 11vh var(--s-4) var(--s-4); }
.palette {
  width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-4); box-shadow: var(--e-5); overflow: hidden;
  transform: translateY(-8px) scale(.985); transition: transform var(--t-2) var(--spring);
}
.scrim.open .palette { transform: none; }
.palette-input { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-bottom: 1px solid var(--line); }
.palette-input input { flex: 1; border: none; background: none; outline: none; font-size: var(--fs-md); min-width: 0; }
.palette-input input::placeholder { color: var(--ink-4); }
.palette-list { max-height: min(46vh, 340px); overflow: auto; padding: var(--s-2); }
.palette-group { padding: var(--s-2) var(--s-3) 4px; }
.palette-item {
  display: flex; align-items: center; gap: var(--s-3); padding: 8px var(--s-3); border-radius: var(--r-2);
  cursor: pointer; font-size: var(--fs-base); border: none; background: none; width: 100%; text-align: left;
}
.palette-item:hover, .palette-item.cursor { background: var(--sunk); }
.palette-item .pi { width: 17px; color: var(--ink-3); display: grid; place-items: center; }
.palette-item kbd { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
.palette-empty { padding: var(--s-6); text-align: center; color: var(--ink-3); }

.modal-scrim { place-items: center; padding: var(--s-5); }
.modal {
  width: 100%; max-width: 420px; background: var(--panel); border-radius: var(--r-4);
  box-shadow: var(--e-5); padding: var(--s-6); display: grid; gap: var(--s-4);
  transform: scale(.97); transition: transform var(--t-2) var(--spring);
}
.scrim.open .modal { transform: none; }
.modal h3 { font-size: var(--fs-lg); }
.modal p { color: var(--ink-2); }
.modal-actions { display: flex; gap: var(--s-2); justify-content: flex-end; }

.menu {
  position: absolute; z-index: 80; min-width: 190px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r-3); box-shadow: var(--e-4);
  padding: var(--s-1); display: grid; gap: 1px;
  transform-origin: top left; animation: menuIn var(--t-2) var(--spring);
}
@keyframes menuIn { from { opacity: 0; transform: scale(.96) translateY(-4px); } to { opacity: 1; transform: none; } }
.menu button {
  display: flex; align-items: center; gap: var(--s-3); padding: 7px var(--s-3); border-radius: var(--r-2);
  border: none; background: none; cursor: pointer; font-size: var(--fs-base); text-align: left; width: 100%;
  color: var(--ink); transition: background var(--t-1) var(--ease);
}
.menu button:hover { background: var(--sunk); }
.menu button.danger { color: var(--neg); }
.menu button.danger:hover { background: var(--neg-wash); }
.menu .menu-sep { height: 1px; background: var(--line); margin: var(--s-1) 0; }

.toasts { position: fixed; right: var(--s-5); bottom: var(--s-5); z-index: 95; display: grid; gap: var(--s-2); justify-items: end; }
@media (max-width: 640px) { .toasts { left: var(--s-4); right: var(--s-4); justify-items: stretch; } }
.toast {
  display: flex; align-items: center; gap: 10px; background: var(--solid); color: var(--ink-inv);
  padding: 10px var(--s-4); border-radius: var(--r-2); box-shadow: var(--e-4);
  font-size: var(--fs-base); font-weight: 500; max-width: 340px;
  animation: toastIn var(--t-3) var(--spring);
}
.toast.leaving { animation: toastOut var(--t-2) var(--ease) forwards; }
.toast i { width: 7px; height: 7px; border-radius: var(--r-full); background: var(--pos); flex: none; }
.toast.warn i { background: var(--warn); }
.toast.neg i { background: var(--neg); }
@keyframes toastIn  { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(.98); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ==========================================================================
   Split layout (list beside a detail panel)
   ========================================================================== */
.split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--s-4); align-items: start; }
@media (max-width: 940px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* ---- ranked rows (contacts, templates) ---------------------------------- */
.rankrow {
  display: grid; grid-template-columns: 22px 32px 1fr auto auto; gap: var(--s-3); align-items: center;
  width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-2); padding: 9px var(--s-3); margin-bottom: var(--s-2); cursor: pointer;
  transition: border-color var(--t-1) var(--ease), box-shadow var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.rankrow:hover { box-shadow: var(--e-2); transform: translateX(2px); }
.rankrow.on { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc); }
.rankrow .rank {
  font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3); text-align: center;
  background: var(--sunk); border-radius: var(--r-1); padding: 2px 0;
}
.rankrow .rr-main { min-width: 0; }
.rankrow .rr-name { display: block; font-size: var(--fs-base); font-weight: 600; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rankrow .rr-sub { display: block; font-size: var(--fs-sm); color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rankrow .rr-tag {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--pc); background: var(--sunk); padding: 3px 8px; border-radius: var(--r-1); white-space: nowrap;
}
.rr-moves { display: flex; gap: 2px; }
@media (max-width: 560px) { .rankrow { grid-template-columns: 22px 32px 1fr auto; } .rankrow .rr-tag { display: none; } }

.icon-btn {
  width: 26px; height: 26px; border-radius: var(--r-1); border: 1px solid transparent;
  background: none; color: var(--ink-3); cursor: pointer; display: grid; place-items: center;
  font-size: 12px; transition: background var(--t-1) var(--ease), color var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.icon-btn:hover { background: var(--sunk); color: var(--ink); }
.icon-btn:active { transform: scale(.9); }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }

.addrow {
  width: 100%; padding: 11px var(--s-4); border: 1.5px dashed var(--line-2); border-radius: var(--r-2);
  background: none; color: var(--ink-3); cursor: pointer; font-size: var(--fs-base); font-weight: 500;
  text-align: left; transition: border-color var(--t-2) var(--ease), color var(--t-2) var(--ease), background var(--t-2) var(--ease);
}
.addrow:hover { border-color: var(--ac); color: var(--ac); background: var(--ac-wash); }

/* ---- fact list ---------------------------------------------------------- */
.facts { margin: 0; display: grid; gap: var(--s-2); }
.facts > div { display: grid; grid-template-columns: 96px 1fr; gap: var(--s-3); align-items: baseline; }
.facts dt { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.facts dd { margin: 0; font-size: var(--fs-base); min-width: 0; overflow-wrap: anywhere; }

/* ---- step editor -------------------------------------------------------- */
.touch.editing { grid-template-columns: 1fr; padding: var(--s-4); align-items: stretch; }
.step-edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s-3); width: 100%; }
.step-edit .field > label { font-size: 10.5px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.step-edit .input { padding: 7px 10px; font-size: var(--fs-sm); }

/* ---- research feed ------------------------------------------------------ */
.subtabs { display: flex; gap: var(--s-2); margin-bottom: var(--s-5); flex-wrap: wrap; }
.subtab {
  padding: 6px 13px; border-radius: var(--r-full); border: 1px solid var(--line-2); background: var(--panel);
  color: var(--ink-2); cursor: pointer; font-size: var(--fs-base); font-weight: 500;
  transition: all var(--t-2) var(--ease);
}
.subtab:hover { border-color: var(--line-3); color: var(--ink); }
.subtab[aria-selected="true"] { background: var(--solid); border-color: var(--solid); color: var(--ink-inv); font-weight: 600; }

.feed { display: grid; gap: var(--s-2); }
.feed-item {
  display: grid; grid-template-columns: 116px 1fr; gap: var(--s-4);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3);
  padding: var(--s-4) var(--s-5);
  transition: border-color var(--t-2) var(--ease), box-shadow var(--t-2) var(--ease);
}
.feed-item:hover { border-color: var(--line-2); box-shadow: var(--e-2); }
@media (max-width: 680px) { .feed-item { grid-template-columns: minmax(0, 1fr); gap: var(--s-2); } }
.fi-side { display: grid; gap: 3px; align-content: start; }
@media (max-width: 680px) { .fi-side { grid-auto-flow: column; justify-content: start; gap: var(--s-2); align-items: center; } }
.fi-kind {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ac); background: var(--ac-wash); border-radius: var(--r-1); padding: 3px 7px; justify-self: start;
}
.fi-when { font-size: var(--fs-sm); color: var(--ink-3); }
.fi-main { min-width: 0; display: grid; gap: 6px; }
.fi-who { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); }
.fi-main h4 { font-size: var(--fs-md); font-weight: 600; letter-spacing: -.018em; line-height: 1.35; }
.fi-detail { font-size: var(--fs-base); color: var(--ink-2); }
.fi-src { font-family: var(--mono); font-size: var(--fs-xs); color: var(--ink-4); }
.fi-use {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; margin-top: var(--s-2);
  padding: var(--s-3); border-radius: var(--r-2); background: var(--sunk);
}
.fi-line { flex: 1; min-width: 180px; font-size: var(--fs-base); font-style: italic; color: var(--ink); }

/* ---- composer additions -------------------------------------------------- */
.letter-edit {
  width: 100%; min-height: 260px; resize: none; overflow: hidden;
  font-family: var(--mono); font-size: 13px; line-height: 1.85; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3);
  padding: var(--s-6); box-shadow: var(--e-1);
  transition: border-color var(--t-2) var(--ease), box-shadow var(--t-2) var(--ease);
}
.letter-edit:focus { outline: none; border-color: var(--ac); box-shadow: var(--ring); }
.letter-edit.flash { animation: flash 620ms var(--ease); }

.picker { display: flex; gap: var(--s-2); overflow-x: auto; padding-bottom: var(--s-2); margin-bottom: var(--s-4); }
.pick {
  flex: none; display: grid; gap: 1px; padding: 7px 13px; border-radius: var(--r-2);
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; text-align: left;
  transition: border-color var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.pick:hover { border-color: var(--line-3); transform: translateY(-1px); }
.pick[aria-selected="true"] { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc); }
.pick-day { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--pc); }
.pick-who { font-size: var(--fs-sm); font-weight: 600; }

.mini-act {
  padding: var(--s-3); border-radius: var(--r-2); background: var(--sunk); margin-bottom: var(--s-2);
  display: grid; gap: var(--s-2); justify-items: start;
}
.mini-act p { font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.45; }

/* ==========================================================================
   Sidebar nav groups
   ========================================================================== */
.nav-group { display: grid; gap: 1px; margin-bottom: var(--s-4); }
.nav-group:last-child { margin-bottom: 0; }
.nav-group-label { padding: 0 var(--s-3) 5px; }


/* ==========================================================================
   Sequence builder
   ========================================================================== */
.builder { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: var(--s-5); align-items: start; }
@media (max-width: 960px) { .builder { grid-template-columns: minmax(0, 1fr); gap: var(--s-4); } }

.rail { display: grid; gap: 0; position: sticky; top: calc(var(--topbar) + var(--s-4)); max-height: calc(100vh - var(--topbar) - var(--s-7)); overflow-y: auto; padding-right: var(--s-1); }
@media (max-width: 960px) { .rail { position: static; max-height: none; } }

.stepcard {
  display: grid; gap: 3px; text-align: left; width: 100%; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--pc);
  border-radius: var(--r-2); padding: 10px var(--s-3);
  transition: border-color var(--t-1) var(--ease), box-shadow var(--t-1) var(--ease), transform var(--t-1) var(--ease);
}
.stepcard:hover { box-shadow: var(--e-2); transform: translateX(2px); }
.stepcard.on { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), var(--e-2); background: var(--panel); }
.sc-top { display: flex; align-items: center; gap: var(--s-2); }
.sc-n {
  width: 18px; height: 18px; border-radius: var(--r-1); background: var(--sunk);
  color: var(--ink-3); font-family: var(--mono); font-size: 10px; display: grid; place-items: center; flex: none;
}
.stepcard.on .sc-n { background: var(--pc); color: #fff; }
.sc-ch { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.sc-dot { margin-left: auto; width: 7px; height: 7px; border-radius: var(--r-full); background: var(--line-2); flex: none; }
.sc-dot.done { background: var(--ink-4); }
.sc-dot.ok   { background: var(--pos); }
.sc-dot.due  { background: var(--ac); box-shadow: 0 0 0 3px var(--ac-wash); }
.sc-who { font-size: var(--fs-base); font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-note { font-size: var(--fs-sm); color: var(--ink-3); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-foot { display: flex; align-items: center; gap: var(--s-2); margin-top: 2px; }
.sc-day { font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
.sc-var { font-family: var(--mono); font-size: 10px; color: var(--ac); background: var(--ac-wash); padding: 1px 6px; border-radius: var(--r-1); }

.wait { display: flex; align-items: center; gap: var(--s-2); padding: 5px 0; }
.wait-line { flex: 1; height: 1px; background: var(--line); }
.wait-pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--ink-3);
  background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r-full); padding: 2px 9px; white-space: nowrap;
}
.wait-pill input {
  width: 30px; border: none; background: none; text-align: center; font-family: var(--mono);
  font-size: var(--fs-xs); color: var(--ink); padding: 0;
  -moz-appearance: textfield;
}
.wait-pill input::-webkit-outer-spin-button, .wait-pill input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.wait-pill:focus-within { border-color: var(--ac); box-shadow: var(--ring); }

/* ---- editor ---- */
.editor { overflow: hidden; }
.ed-head { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); }
.ed-meta {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: var(--s-3);
  padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--line); background: var(--sunk);
}
.ed-meta .field > span {
  font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
}
.ed-meta .input { padding: 7px 10px; font-size: var(--fs-sm); }

.ed-tabs { display: flex; align-items: center; gap: var(--s-1); padding: var(--s-3) var(--s-5) 0; }
.vtab {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: var(--r-1) var(--r-1) 0 0;
  border: 1px solid transparent; border-bottom: none; background: none; cursor: pointer;
  font-family: var(--mono); font-size: var(--fs-sm); color: var(--ink-3);
  transition: background var(--t-1) var(--ease), color var(--t-1) var(--ease);
}
.vtab:hover { background: var(--sunk); color: var(--ink); }
.vtab.on { background: var(--panel); border-color: var(--line); color: var(--ink); font-weight: 600; box-shadow: 0 1px 0 0 var(--panel); }
.vx { color: var(--ink-4); font-size: 10px; padding: 0 1px; }
.vx:hover { color: var(--neg); }
.vadd {
  width: 24px; height: 24px; border-radius: var(--r-1); border: 1px dashed var(--line-2); background: none;
  color: var(--ink-3); cursor: pointer; font-size: 13px; line-height: 1;
  transition: border-color var(--t-1) var(--ease), color var(--t-1) var(--ease);
}
.vadd:hover { border-color: var(--ac); color: var(--ac); }

.ed-body { padding: 0 var(--s-5) var(--s-4); border-top: 1px solid var(--line); margin-top: -1px; }
.subject {
  width: 100%; border: none; border-bottom: 1px solid var(--line); background: none; padding: var(--s-4) 0 10px;
  font-size: var(--fs-md); font-weight: 600; letter-spacing: -.015em; outline: none;
}
.subject::placeholder { color: var(--ink-4); font-weight: 400; }
.bodytext {
  width: 100%; min-height: 220px; resize: none; overflow: hidden; border: none; background: none;
  padding: var(--s-4) 0 var(--s-2); outline: none;
  font-family: var(--mono); font-size: 13px; line-height: 1.85; color: var(--ink);
}
.bodytext.flash { animation: flash 620ms var(--ease); }
.fieldbar { display: flex; gap: var(--s-1); flex-wrap: wrap; padding-top: var(--s-2); border-top: 1px dashed var(--line); }
.fbtn {
  font-family: var(--mono); font-size: var(--fs-xs); padding: 3px 8px; border-radius: var(--r-1);
  border: 1px solid var(--line); background: var(--sunk); color: var(--ink-3); cursor: pointer;
  transition: all var(--t-1) var(--ease);
}
.fbtn:hover { border-color: var(--ac); color: var(--ac); background: var(--ac-wash); }
.fbtn:active { transform: scale(.94); }

.ed-foot {
  display: flex; align-items: flex-end; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-4) var(--s-5); border-top: 1px solid var(--line); background: var(--sunk);
}
.ed-foot .field { min-width: 180px; }
.ed-foot .field > span { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.ed-foot .input { padding: 7px 10px; font-size: var(--fs-sm); }

.assist-card { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }

/* ---- preview sheet ---- */
.modal-wide { max-width: 560px; }
.mailprev { display: grid; gap: var(--s-3); }
.mp-head { display: flex; align-items: center; gap: var(--s-3); padding-bottom: var(--s-3); border-bottom: 1px solid var(--line); }
.mp-subject { font-size: var(--fs-md); font-weight: 650; letter-spacing: -.02em; }
.mp-body {
  margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 13px; line-height: 1.85;
  color: var(--ink-2); background: var(--sunk); border-radius: var(--r-2); padding: var(--s-4);
  max-height: 46vh; overflow: auto;
}

</style>
</head>
<body>
<div id="root">
  <!-- Boot frame. Replaced by the router on first resolve. -->
  <div class="auth">
    <div class="auth-main"><div class="auth-box">
      <div class="brand"><span class="glyph"></span><b>Frontdoor</b></div>
      <h1>Welcome back</h1>
      <p class="sub">Loading your workspace.</p>
      <div class="col g3" aria-hidden="true">
        <span class="skel" style="width:100%;height:38px;border-radius:8px"></span>
        <span class="skel" style="width:100%;height:38px;border-radius:8px"></span>
        <span class="skel" style="width:100%;height:42px;border-radius:10px"></span>
      </div>
    </div></div>
  </div>
</div>

<noscript>
  <div style="padding:40px;max-width:520px;margin:0 auto;font-family:system-ui">
    <h1 style="font-size:24px;margin:0 0 8px">Frontdoor needs JavaScript</h1>
    <p style="color:#555963;margin:0">This is a single page app. Turn JavaScript on and reload.</p>
  </div>
</noscript>
<script>
/* assets/js/store.js */
/* ==========================================================================
   store.js — application state
   Stands in for the backend. Everything persists to localStorage so a reload
   behaves like a real session. Wrapped in try/catch because private windows
   and blocked site data both throw on access.
   ========================================================================== */
(function (window) {
  'use strict';

  var KEY = 'frontdoor.v3';

  var PERSONAS = [
    { key: 'Peer',           colour: '--p-peer' },
    { key: 'Recruiter',      colour: '--p-recruiter' },
    { key: 'Hiring manager', colour: '--p-manager' },
    { key: 'Skip level',     colour: '--p-exec' },
    { key: 'Shared tie',     colour: '--p-tie' },
    { key: 'Other',          colour: '--line-3' }
  ];
  var CHANNELS = ['Email', 'LinkedIn', 'Call', 'Reply', 'ATS', 'Text'];

  function uid(p) { return (p || 'x') + '_' + Math.random().toString(36).slice(2, 8); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---- profile --------------------------------------------------------- */
  var SEED_PROFILE = {
    name: 'Evan Pogue',
    email: 'evan@example.com',
    location: 'Chicago, IL',
    years: 8,
    imported: false,
    source: null,
    voice: { traits: ['Direct', 'Numbers first', 'One ask'] },
    roles: [
      { id: 'r1', title: 'Senior AE, Mid-Market', company: 'Brightline, Chicago', span: '2023 to now', on: true,
        bullets: [

          'Rebuilt discovery when cycles went from 30 days to 70',
          'Held the team together through 40% attrition and still made the year'
        ] },
      { id: 'r2', title: 'Account Executive', company: 'Northwind, Chicago', span: '2021 to 2023', on: true,
        bullets: [
          'Grew territory ARR 41% year over year',
          'Got four new AEs to quota in two quarters',
          'Top 3 of 38 reps, two years running'
        ] },
      { id: 'r3', title: 'SDR, then AE', company: 'Cobalt, remote', span: '2018 to 2021', on: true,
        bullets: [
          'Closed the biggest deal the company had done at $340k',

        ] }
    ],
    wins: [

(function (window, document) {
  'use strict';

  var esc = UI.esc;
  window.Views = window.Views || {};

  /* ======================================================================
     TEMPLATE LIBRARY
     ====================================================================== */
  window.Views.templates = function () {
    var selected = Store.state.templates[0] ? Store.state.templates[0].id : null;

    var v = Shell.mount({
      nav: 'templates',
      crumbs: [{ label: 'Templates' }],
      actions: '<button class="btn btn-primary btn-sm" id="new-tpl">New template</button>',
      html: '<div class="page-head"><h1>Your messages</h1>' +
        '<p>Seven to start with. Edit any of them and the change sticks for every campaign after this. The ones you write yourself sit alongside them.</p></div>' +
        '<div class="split"><div id="tpl-list"></div><div id="tpl-edit"></div></div>'
    });

    function paintList() {
      v.querySelector('#tpl-list').innerHTML = Store.state.templates.map(function (t) {
        return '<button class="rankrow' + (t.id === selected ? ' on' : '') + '" data-tpl="' + t.id + '"' +
          ' style="--pc:var(' + Store.colourFor(t.persona) + ')">' +
          '<span class="rank" style="background:none;color:var(--ink-4)">' + (t.stock ? '' : '★') + '</span>' +
          '<span class="rr-main"><span class="rr-name">' + esc(t.name) + '</span>' +
          '<span class="rr-sub">' + esc(t.persona) + ' · ' + esc(t.channel) + '</span></span>' +
          '<span class="rr-tag">' + (t.stock ? 'Stock' : 'Yours') + '</span></button>';
      }).join('');
      paintEdit();
    }

    function paintEdit() {
      var t = Store.template(selected);
      var box = v.querySelector('#tpl-edit');
      if (!t) { box.innerHTML = '<div class="card p6"><p class="dim">Pick one on the left.</p></div>'; return; }
      box.innerHTML =
        '<div class="card p5 col g3">' +
          '<div class="field"><label for="t-name">Name</label><input class="input" id="t-name" value="' + esc(t.name) + '"></div>' +
          '<div class="grid cols-2">' +
            '<div class="field"><label for="t-persona">For</label><select class="input" id="t-persona">' +
              Store.PERSONAS.map(function (p) { return '<option' + (p.key === t.persona ? ' selected' : '') + '>' + esc(p.key) + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="field"><label for="t-channel">Channel</label><select class="input" id="t-channel">' +
              Store.CHANNELS.map(function (ch) { return '<option' + (ch === t.channel ? ' selected' : '') + '>' + ch + '</option>'; }).join('') +
            '</select></div>' +
          '</div>' +
          '<div class="field"><label for="t-body">Message</label>' +
            '<textarea class="input" id="t-body" style="min-height:250px;font-family:var(--mono);font-size:13px;line-height:1.8">' + esc(t.body) + '</textarea>' +
            '<p class="hint">Merge fields: {first} {name} {title} {company} {role} {angle} {slug}</p></div>' +
          '<div class="row between">' +
            '<span class="hint" id="t-saved" style="opacity:0;transition:opacity var(--t-2)">Saved</span>' +
            '<button class="btn btn-danger btn-sm" id="t-del">Delete</button></div>' +
        '</div>';

      ['name', 'persona', 'channel', 'body'].forEach(function (k) {
        var el = box.querySelector('#t-' + k);
        el.addEventListener('change', function () {
          var o = {}; o[k] = this.value;
          Store.updateTemplate(t.id, o);
          var s = box.querySelector('#t-saved'); s.style.opacity = 1;
          setTimeout(function () { s.style.opacity = 0; }, 1400);
          if (k === 'name' || k === 'persona' || k === 'channel') setTimeout(paintList, 0);
        });
      });
      box.querySelector('#t-del').addEventListener('click', function () {
        UI.confirm({ title: 'Delete "' + t.name + '"?', body: 'Any step using it falls back to writing from scratch.', confirm: 'Delete', danger: true })
          .then(function (ok) {
            if (!ok) return;
            Store.removeTemplate(t.id);
            selected = Store.state.templates[0] ? Store.state.templates[0].id : null;
            paintList(); UI.toast('Deleted.');
          });
      });
    }

    UI.on(v, 'click', '[data-tpl]', function (e, el) { selected = el.dataset.tpl; paintList(); });
    document.getElementById('new-tpl').addEventListener('click', function () {
      var t = Store.addTemplate({ name: 'Untitled', persona: 'Peer', channel: 'Email',
        body: '{first}, \n\n\n\nWorth fifteen minutes?' });
      selected = t.id; paintList();
      UI.toast('New template. Give it a name.');
    });

    paintList();
  };
})(window, document);

(function (window, document) {

      '<div class="preview">' +
        '<div><p class="cap" style="padding:0 var(--s-3) var(--s-2)">Sections</p>' +

          '<div class="pub">' +
            '<section class="hero" data-sec="hero">' +
              '<p class="cap">Written for ' + esc(c.company) + ', ' + esc(c.role) + '</p>' +
              '<h2>' + esc(pf.name) + '</h2>' +
              '<p class="thesis">I have already run the change ' + esc(c.company) + ' is in the middle of. Seat pricing, longer cycles, and a team that has to relearn how to open a deal.</p>' +
              '<div class="row wrap g2"><span class="chip">' + esc(pf.location) + '</span>' +
              '<span class="chip">' + pf.years + ' years in SaaS</span><span class="chip">Mid-market and SMB</span></div>' +
            '</section>' +
            '<section data-sec="why"><h3 class="cap">Why ' + esc(c.company) + '</h3>' +
              '<p class="take">' + esc(angle.take) + '</p></section>' +
            '<section data-sec="proof"><h3 class="cap">The short version</h3><div class="stats">' + stats() + '</div></section>' +
            '<section data-sec="exp"><h3 class="cap">Where I have been</h3><div class="history">' + history() + '</div></section>' +
            '<section data-sec="plan"><h3 class="cap">First 90 days at ' + esc(c.company) + '</h3><div class="days">' +
              '<div><span>30</span>Sit on twenty calls. Find out where mid-market deals actually stall against the five seat floor.</div>' +
              '<div><span>60</span>Rewrite discovery for a two call close and hand the team a working script, not a deck.</div>' +
              '<div><span>90</span>Two closed won on the new motion, and a written teardown of what moved the number.</div>' +
            '</div></section>' +
            '<section data-sec="video"><h3 class="cap">Ninety seconds</h3><div class="reel"><b>▶</b></div></section>' +
            '<section data-sec="said"><h3 class="cap">Someone who worked with me</h3>' +
              '<div class="said"><p>"' + esc(pf.reference.quote) + '"</p>' +
              '<div class="by"><span class="avatar avatar-md" style="background:var(--p-tie)">' + esc(pf.reference.initials) + '</span>' +

              pf.stack.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join('') + '</div></section>' +
            '<div class="pub-foot"><div class="row wrap g2"><span class="chip">' + esc(pf.email) + '</span>' +

/* assets/js/main.js */
/* ==========================================================================
   main.js — wiring. Routes, palette contents, keyboard shortcuts, boot.
   ========================================================================== */
(function (window, document) {
  'use strict';

  Store.init();
  UI.mountPalette();

  /* ---- routes --------------------------------------------------------- */
  Router
    .add('/login',  Views.login,  { public: true })
    .add('/signup', Views.signup, { public: true })
    .add('/',        Views.home)
    .add('/import',  Views.importer)
    .add('/settings', Views.settings)
    .add('/templates', Views.templates)
    .add('/c/:id/people',   Views.people)
    .add('/c/:id/research', Views.research)
    .add('/c/:id/sequence', Views.sequence)
    .add('/c/:id/page',     Views.page)
    .notFound(function () { Router.go(Store.isAuthed() ? '/' : '/login', true); });

  /* ---- command palette contents --------------------------------------- */
  UI.paletteSource = function () {
    var cid = Shell.activeCampaignId();
    var items = [
      { group: 'Go to', icon: '◉', label: 'Overview', hint: 'G O', run: function () { Router.go('/'); } }
    ];
    if (cid) {
      items.push(
        { group: 'Go to', icon: '◎', label: 'Contacts', hint: 'G P', run: function () { Router.go('/c/' + cid + '/people'); } },
        { group: 'Go to', icon: '◈', label: 'Research on the company and the people', hint: 'G R', run: function () { Router.go('/c/' + cid + '/research'); } },
        { group: 'Go to', icon: '≡', label: 'The fourteen day sequence', hint: 'G S', run: function () { Router.go('/c/' + cid + '/sequence'); } },
        { group: 'Go to', icon: '▤', label: 'Your public page', run: function () { Router.go('/c/' + cid + '/page'); } }
      );
    }
    items.push(
      { group: 'Go to', icon: '❏', label: 'Message templates', run: function () { Router.go('/templates'); } },
      { group: 'Go to', icon: '⚙', label: 'Settings', run: function () { Router.go('/settings'); } },
      { group: 'Do', icon: '↑', label: 'Import a résumé or LinkedIn profile', run: function () { Router.go('/import'); } }
    );
    if (cid) {
      items.push(
        { group: 'Do', icon: '⧉', label: 'Copy the public page link', run: function () {
          var c = Store.campaign(cid);
          UI.copy('https://frontdoor.app/p/' + c.slug);
          UI.toast('Link copied.');
        } },
        { group: 'Do', icon: '◈', label: 'Simulate a page view', run: function () {
          var c = Store.campaign(cid);
          c.views += 1; c.lastView = 'just now'; Store.save();
          UI.toast('Marcus opened your page. Just now.');
        } }
      );
    }
    items.push({ group: 'Account', icon: '→', label: 'Sign out', run: function () { Store.signOut(); Router.go('/login'); } });
    return items;
  };

  /* ---- g-then-key shortcuts ------------------------------------------- */
  var awaitingG = false, gTimer = null;
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key || '').toLowerCase();
    var cid = Shell.activeCampaignId();

    if (awaitingG) {
      awaitingG = false;
      clearTimeout(gTimer);
      if (k === 'o') Router.go('/');
      else if (k === 'p' && cid) Router.go('/c/' + cid + '/people');
      else if (k === 's' && cid) Router.go('/c/' + cid + '/sequence');
      else if (k === 'r' && cid) Router.go('/c/' + cid + '/research');
      else if (k === 't') Router.go('/templates');
      return;
    }
    if (k === 'g') {
      awaitingG = true;
      gTimer = setTimeout(function () { awaitingG = false; }, 1100);
    }
  });

  /* ---- boot ------------------------------------------------------------ */
  Router.start();
})(window, document);

</script>
