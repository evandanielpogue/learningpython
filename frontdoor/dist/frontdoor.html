/* ==========================================================================
   views/importer.js — read a resume once. Which wins matter is decided per
   company, against that listing, so nothing is picked here.
   ========================================================================== */
(function (window, document) {
  'use strict';

  var esc = UI.esc;
  window.Views = window.Views || {};

  var TEXTY = /\.(txt|md|markdown|text|csv|json|rtf)$/i;

  window.Views.importer = function () {
    var pf = Store.state.profile;
    var step = pf.imported ? 2 : 1;
    var parsed = null;
    var pending = '';

    function pips(active) {
      return '<div class="steps-bar">' + ['Your resume', 'Check it', 'Add a company'].map(function (l, i) {
        var n = i + 1;
        var st = n < active ? 'done' : n === active ? 'active' : 'todo';
        return '<span class="step-pip" data-state="' + st + '"><span class="n"><span>' + n + '</span></span>' + esc(l) + '</span>' +
          (i < 2 ? '<span style="color:var(--ink-4)">→</span>' : '');
      }).join('') + '</div>';
    }

    /* ------------------------------------------------------------ step 1 -- */
    function stepOne() {
      return pips(1) +
        '<div class="card p6">' +
          '<h3 class="mb2">Hand over your history</h3>' +
          '<p class="dim mb5" style="font-size:var(--fs-sm)">We read it once. Every company you add after this pulls from it.</p>' +
          '<label class="drop" id="drop" for="file-in">' +
            '<span class="drop-ic">↑</span>' +
            '<b>Drop your resume here</b>' +
            '<span class="hint">or click to choose a file</span>' +
            '<input type="file" id="file-in" accept=".txt,.md,.rtf,.pdf,.doc,.docx,text/plain" hidden>' +
          '</label>' +
          '<p class="lookup-msg hide" id="file-msg"></p>' +

          '<div class="or"><span>or paste it</span></div>' +
          '<textarea class="input listing-in" id="paste" spellcheck="false" ' +
            'placeholder="Open your resume, select all, paste it here. Plain text is fine."></textarea>' +
          '<div class="row between wrap mt4 g3">' +
            '<button class="btn btn-ghost btn-sm" id="use-example">Use an example resume</button>' +
            '<button class="btn btn-primary" id="read" disabled>Read it <span class="arr">→</span></button>' +
          '</div>' +
        '</div>';
    }

    function wireOne(v) {
      var ta = v.querySelector('#paste');
      var go = v.querySelector('#read');
      var msg = v.querySelector('#file-msg');
      var drop = v.querySelector('#drop');

      function check() { go.disabled = ta.value.trim().length < 60; }
      ta.value = pending;
      check();
      ta.addEventListener('input', function () { pending = ta.value; check(); });

      function take(file) {
        if (!file) return;
        msg.classList.remove('hide', 'ok');
        if (!TEXTY.test(file.name) && !/^text\//.test(file.type)) {
          msg.textContent = 'We cannot read ' + (file.name.split('.').pop() || 'that').toUpperCase() +
            ' in the browser yet. Open it, select all, and paste it below.';
          ta.focus();
          return;
        }
        var fr = new FileReader();
        fr.onload = function () {
          ta.value = String(fr.result).replace(/\u0000/g, '');
          pending = ta.value;
          check();
          msg.classList.add('ok');
          msg.textContent = 'Read ' + file.name + '. Have a look, then read it in.';
        };
        fr.onerror = function () { msg.textContent = 'Could not open that file.'; };
        fr.readAsText(file);
      }

      v.querySelector('#file-in').addEventListener('change', function () { take(this.files && this.files[0]); });
      ['dragenter', 'dragover'].forEach(function (e) {
        drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach(function (e) {
        drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove('over'); });
      });
      drop.addEventListener('drop', function (ev) {
        take(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]);
      });

      v.querySelector('#use-example').addEventListener('click', function () {
        ta.value = Store.EXAMPLE_RESUME;
        pending = ta.value;
        check();
        ta.focus();
      });

      go.addEventListener('click', function () {
        parsed = Store.parseResume(ta.value, pending === Store.EXAMPLE_RESUME ? 'the example resume' : 'your resume');
        Store.applyResume(parsed);
        step = 2;
        paint();
        UI.toast(parsed.roles.length + ' roles and ' + parsed.wins.length + ' wins.');
      });
    }

    /* ------------------------------------------------------------ step 2 -- */
    function stepTwo() {
      var p = Store.state.profile;
      var missing = [];
      if (!p.name) missing.push('a name');
      if (!p.roles.length) missing.push('any roles');
      if (!p.wins.length) missing.push('a win with a number in it');

      return pips(2) +
        '<div class="card p6 mb4">' +
          '<div class="row between wrap mb3 g3"><h3>Here is what came out</h3>' +
          '<span class="cap">' + esc(p.source || 'your resume') + '</span></div>' +
          (missing.length
            ? '<p class="lookup-msg mb4">We could not find ' + esc(missing.join(', ')) +
              '. Go back and paste more of it, or fix it in Settings later.</p>'
            : '') +
          '<dl class="facts mb5">' +
            '<div><dt>Name</dt><dd>' + esc(p.name || '—') + '</dd></div>' +
            '<div><dt>Where</dt><dd>' + esc(p.location || '—') + '</dd></div>' +
            '<div><dt>Email</dt><dd class="mono" style="font-size:var(--fs-sm)">' + esc(p.email || '—') + '</dd></div>' +
            (p.years ? '<div><dt>Years</dt><dd>' + p.years + '</dd></div>' : '') +
          '</dl>' +
          '<p class="cap mb3" style="margin-top:var(--s-5)">Roles</p>' +
          (p.roles.length
            ? '<div class="grid" style="gap:var(--s-2)" id="roles"></div>'
            : '<p class="hint">None found.</p>') +
        '</div>' +

        '<div class="card p6 mb4">' +
          '<h3 class="mb3">' + p.wins.length + ' win' + (p.wins.length === 1 ? '' : 's') + ' with a number in them</h3>' +
          (p.wins.length
            ? '<p class="dim mb4" style="font-size:var(--fs-sm)">Which three you lead with gets decided per company, against that listing.</p>' +
              '<div class="leadwins">' + p.wins.map(function (w) {
                return '<div><b>' + esc(w.metric) + '</b><span>' + esc(w.short) + '</span></div>';
              }).join('') + '</div>'
            : '<p class="hint">Nothing with a number in it. Bullets like "grew ARR 41%" are what we match against a listing.</p>') +
        '</div>' +

        (Store.state.profile.stack.length
          ? '<div class="card p6 mb4"><h3 class="mb3">Tools</h3><div class="row wrap g2">' +
            Store.state.profile.stack.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') +
            '</div></div>'
          : '') +

        '<div class="row g2 wrap">' +
          '<button class="btn btn-primary" id="done-import">Looks right <span class="arr">→</span></button>' +
          '<button class="btn btn-ghost" id="redo-import">Read a different one</button>' +
        '</div>';
    }

    function wireTwo(v) {
      var rolesEl = v.querySelector('#roles');
      function paintRoles() {
        if (!rolesEl) return;
        rolesEl.innerHTML = Store.state.profile.roles.map(function (r) {
          return '<button class="opt" data-role="' + r.id + '" aria-pressed="' + r.on + '">' +
            '<span class="box"></span><span class="ot">' + esc(r.title || 'Untitled role') +
            '<em>' + esc([r.company, r.span].filter(Boolean).join(', ')) + '</em></span>' +
            '<span class="om mono">' + r.bullets.length + '</span></button>';
        }).join('');
      }
      paintRoles();
      UI.on(v, 'click', '[data-role]', function (e, el) { Store.toggleRole(el.dataset.role); paintRoles(); });

      v.querySelector('#done-import').addEventListener('click', function () {
        if (Store.campaigns().length) { UI.toast('Saved.'); Router.go('/'); return; }
        UI.toast('Saved. Now paste a job listing.');
        Router.go('/new');
      });
      v.querySelector('#redo-import').addEventListener('click', function () {
        step = 1; pending = ''; paint();
      });
    }

    function paint() {
      var v = Shell.mount({
        nav: 'home',
        crumbs: [{ label: 'Overview', href: '/' }, { label: 'Your resume' }],
        html: '<div class="page-head"><h1>Your history</h1>' +
              '<p>Two minutes of setup that every message and every page is built from.</p></div>' +
              (step === 1 ? stepOne() : stepTwo())
      });
      if (step === 1) wireOne(v); else wireTwo(v);
    }

    paint();
  };
})(window, document);

            '<p class="pg-thesis">' + esc(angle ? angle.take : c.story) + '</p></section>' : '') +
          pick([part('story'), part('proof'), part('plan'), part('why'), part('exp'), part('said'), part('stack'), part('video')]) +
          '<div class="pl-sign">' + Views.photoHTML(56) +
            '<div><b>' + esc(pf.name) + '</b><p>' + esc(pf.email) + '</p></div></div>' +
          sFoot() + '</div>';
      }
      return '<div class="pub pub-case">' +
        pick([part('hero'), part('proof'), part('why'), part('story'), part('plan'),
              part('exp'), part('said'), part('stack'), part('video')]) +
        sFoot() + '</div>';
    }

    /* ---------------- the editor around it ---------------- */
    var html =
      '<div class="page-head"><h1>What they see</h1>' +
      '<p>One page, written for one company. Pick a shape, then turn off anything that is not earning its place.</p></div>' +
      '<div class="preview">' +
        '<div class="col g4">' +
          '<div class="card p4">' +
            '<p class="cap mb3">Layout</p>' +
            '<div class="laypick" id="lay">' + LAYOUTS.map(function (l) {
              return '<button class="lay' + (c.pageTemplate === l.key ? ' on' : '') + '" data-lay="' + l.key + '">' +
                '<span class="lay-art lay-' + l.key + '"><i></i><i></i><i></i></span>' +
                '<b>' + esc(l.name) + '</b><em>' + esc(l.sub) + '</em></button>';
            }).join('') + '</div>' +
          '</div>' +
          '<div class="card p4">' +
            '<p class="cap mb3">Sections</p>' +
            '<div class="sec-toggles" id="toggles"></div>' +
          '</div>' +
          '<div class="card p4">' +
            '<p class="cap mb2">Opens</p><h3 class="mono">' + c.views + '</h3>' +
            '<p class="dimmer" style="font-size:var(--fs-sm)">Last one ' + esc(c.lastView) + '</p>' +
            (pf.photo ? '' : '<p class="hint mt3">No photo yet. A face on this page is worth more than another bullet. <a href="#/settings">Add one</a>.</p>') +
          '</div>' +
        '</div>' +
        '<div class="browser">' +
          '<div class="browser-bar"><i></i><i></i><i></i><span class="url">frontdoor.app/p/' + esc(c.slug) + '</span></div>' +
          '<div id="pub-mount">' + pageBody() + '</div>' +
        '</div>' +
      '</div>';

    var v = Shell.mount({
      nav: 'page',
      crumbs: [{ label: 'Overview', href: '/' }, { label: c.company, href: '/c/' + c.id }, { label: 'Page' }],
      actions: '<button class="btn btn-secondary btn-sm" id="copy-link">Copy link</button>' +
               '<button class="btn btn-primary btn-sm" id="sim">Simulate a view</button>',
      html: html
    });

    function repaintPage() {
      v.querySelector('#pub-mount').innerHTML = pageBody();
      var el = v.querySelector('.pub');
      if (el) { el.classList.remove('pub-in'); void el.offsetWidth; el.classList.add('pub-in'); }
    }

    function paintToggles() {
      v.querySelector('#toggles').innerHTML = c.sections.map(function (s) {
        return '<button class="sec-tog" data-sec-key="' + s.key + '" aria-pressed="' + s.on + '">' +
          '<span class="box"></span>' + esc(s.label) + '</button>';
      }).join('');
    }
    paintToggles();

    UI.on(v, 'click', '[data-sec-key]', function (e, el) {
      var s = c.sections.filter(function (x) { return x.key === el.dataset.secKey; })[0];
      s.on = !s.on; Store.save();
      paintToggles(); repaintPage();
    });
    UI.on(v, 'click', '[data-lay]', function (e, el) {
      Store.updateCampaign(c.id, { pageTemplate: el.dataset.lay });
      v.querySelectorAll('[data-lay]').forEach(function (b) { b.classList.toggle('on', b.dataset.lay === el.dataset.lay); });
      repaintPage();
      UI.toast('Switched to ' + LAYOUTS.filter(function (l) { return l.key === el.dataset.lay; })[0].name.toLowerCase() + '.');
    });

    document.getElementById('copy-link').addEventListener('click', function () {
      UI.copy('https://frontdoor.app/p/' + c.slug); UI.toast('Link copied.');
    });
    document.getElementById('sim').addEventListener('click', function () {
      c.views += 1; c.lastView = 'just now'; Store.save();
      UI.toast((hm ? hm.name.split(' ')[0] : 'Someone') + ' opened your page. Just now.');
      Views.page(params);
    });
  };
})(window, document);

/* assets/js/main.js */
/* ==========================================================================
   main.js — wiring. Routes, palette contents, keyboard shortcuts, boot.
   ========================================================================== */
(function (window, document) {
  'use strict';

  Store.init();
  UI.mountPalette();

  /* ---- routes --------------------------------------------------------- */
  Router
    .add('/login',  Views.login,  { public: true })
    .add('/signup', Views.signup, { public: true })
    .add('/',        Views.home)
    .add('/new',     Views.newOpp)
    .add('/import',  Views.importer)
    .add('/settings', Views.settings)
    .add('/templates', Views.templates)
    .add('/c/:id',          Views.opportunity)
    .add('/c/:id/people',   Views.people)
    .add('/c/:id/research', Views.research)
    .add('/c/:id/sequence', Views.sequence)
    .add('/c/:id/page',     Views.page)
    .notFound(function () { Router.go(Store.isAuthed() ? '/' : '/login', true); });

  /* ---- command palette contents --------------------------------------- */
  UI.paletteSource = function () {
    var cid = Shell.activeCampaignId();
    var items = [
      { group: 'Go to', icon: '◉', label: 'Overview', hint: 'G O', run: function () { Router.go('/'); } },
      { group: 'Do', icon: '+', label: 'Add a company from a job listing', run: function () { Router.go('/new'); } }
    ];
    if (cid) {
      items.push(
        { group: 'Go to', icon: '◆', label: 'Company summary', hint: 'G C', run: function () { Router.go('/c/' + cid); } },
        { group: 'Go to', icon: '◎', label: 'Contacts', hint: 'G P', run: function () { Router.go('/c/' + cid + '/people'); } },
        { group: 'Go to', icon: '◈', label: 'Research on the company and the people', hint: 'G R', run: function () { Router.go('/c/' + cid + '/research'); } },
        { group: 'Go to', icon: '≡', label: 'The fourteen day sequence', hint: 'G S', run: function () { Router.go('/c/' + cid + '/sequence'); } },
        { group: 'Go to', icon: '▤', label: 'Your public page', run: function () { Router.go('/c/' + cid + '/page'); } }
      );
    }
    items.push(
      { group: 'Go to', icon: '❏', label: 'Message templates', run: function () { Router.go('/templates'); } },
      { group: 'Go to', icon: '⚙', label: 'Settings', run: function () { Router.go('/settings'); } },
      { group: 'Do', icon: '↑', label: 'Import a résumé or LinkedIn profile', run: function () { Router.go('/import'); } }
    );
    if (cid) {
      items.push(
        { group: 'Do', icon: '⧉', label: 'Copy the public page link', run: function () {
          var c = Store.campaign(cid);
          UI.copy('https://frontdoor.app/p/' + c.slug);
          UI.toast('Link copied.');
        } },
        { group: 'Do', icon: '◈', label: 'Simulate a page view', run: function () {
          var c = Store.campaign(cid);
          c.views += 1; c.lastView = 'just now'; Store.save();
          UI.toast('Marcus opened your page. Just now.');
        } }
      );
    }
    items.push({ group: 'Account', icon: '→', label: 'Sign out', run: function () { Store.signOut(); Router.go('/login'); } });
    return items;
  };

  /* ---- g-then-key shortcuts ------------------------------------------- */
  var awaitingG = false, gTimer = null;
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key || '').toLowerCase();
    var cid = Shell.activeCampaignId();

    if (awaitingG) {
      awaitingG = false;
      clearTimeout(gTimer);
      if (k === 'o') Router.go('/');
      else if (k === 'c' && cid) Router.go('/c/' + cid);
      else if (k === 'n') Router.go('/new');
      else if (k === 'p' && cid) Router.go('/c/' + cid + '/people');
      else if (k === 's' && cid) Router.go('/c/' + cid + '/sequence');
      else if (k === 'r' && cid) Router.go('/c/' + cid + '/research');
      else if (k === 't') Router.go('/templates');
      return;
    }
    if (k === 'g') {
      awaitingG = true;
      gTimer = setTimeout(function () { awaitingG = false; }, 1100);
    }
  });

  /* ---- boot ------------------------------------------------------------ */
  Router.start();
})(window, document);

</script>
</body>
